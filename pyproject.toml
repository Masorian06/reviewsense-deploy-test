[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E731"]  # get_data.py assigns a small lambda on purpose

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # so `pytest` finds app.py from the repository root, as `python -m pytest` would
