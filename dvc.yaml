stages:
  prepare:
    cmd: python src/prepare.py
    deps:
    - data/reviews.csv
    - src/prepare.py
    params:
    - prepare.seed
    - prepare.split
    outs:
    - data/prepared
  featurize:
    cmd: python src/featurize.py
    deps:
    - data/prepared
    - src/featurize.py
    params:
    - featurize.max_features
    - featurize.ngrams
    outs:
    - data/features
  train:
    cmd: python src/train.py
    deps:
    - data/features
    - src/train.py
    params:
    - train.C
    - train.seed
    outs:
    - models/model.pkl
  evaluate:
    cmd: python src/evaluate.py
    deps:
    - data/features
    - models/model.pkl
    - src/evaluate.py
    metrics:
    - eval/metrics.json:
        cache: false
